name: Build StarPath APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: starpath
        run: flutter pub get

      - name: Run unit tests
        working-directory: starpath
        run: flutter test

      - name: Build Split APKs (Optimized for Redmi 7)
        working-directory: starpath
        run: flutter build apk --split-per-abi

      - name: Upload APKs artifact
        uses: actions/upload-artifact@v4
        with:
          name: starpath-apks
          path: starpath/build/app/outputs/flutter-apk/*.apk
